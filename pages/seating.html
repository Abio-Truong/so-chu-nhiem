<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ đồ chỗ ngồi — Sổ Chủ Nhiệm</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/seating.css">
</head>
<body>

  <main class="page-container">

    <div class="page-header">
      <h1 class="page-title" data-i18n="sePageTitle">Sơ đồ chỗ ngồi</h1>
      <div class="page-header-actions teacher-only">
        <button class="btn btn-secondary" id="btn-random" data-i18n="seRandomize">🎲 Xếp ngẫu nhiên</button>
        <button class="btn btn-primary"   id="btn-save-seating" data-i18n="seSave">💾 Lưu sơ đồ</button>
      </div>
    </div>

    <!-- Classroom visual -->
    <div class="card classroom-wrapper">

      <!-- Blackboard at top (behind teacher) -->
      <div class="blackboard" data-i18n="seBlackboard">🖊️ Bảng đen</div>

      <!-- Teacher desk — top-left corner -->
      <div class="teacher-desk" data-i18n="seTeacherDesk">📋 Bàn Giáo Viên</div>

      <!-- Seating grid: 4 columns = 4 groups -->
      <div class="seating-grid" id="seating-grid">
        <!-- Rendered by JS -->
      </div>

      <!-- Legend -->
      <div class="seating-legend">
        <span class="legend-item to-1" data-i18n="seLegendTo1">Tổ 1</span>
        <span class="legend-item to-2" data-i18n="seLegendTo2">Tổ 2</span>
        <span class="legend-item to-3" data-i18n="seLegendTo3">Tổ 3</span>
        <span class="legend-item to-4" data-i18n="seLegendTo4">Tổ 4</span>
        <span class="legend-item to-empty" data-i18n="seLegendEmpty">Trống</span>
      </div>
    </div>

    <!-- Gọi tên (random student picker) -->
    <div class="card" style="margin-top:16px">
      <h2 class="card-title" data-i18n="seGoiTenTitle">🎤 Gọi tên ngẫu nhiên</h2>
      <div class="goi-ten-controls">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" data-i18n="seGoiTenFrom">Chọn từ:</label>
          <select id="goi-ten-from" class="form-control" style="width:auto">
            <option value="all">Cả lớp</option>
            <option value="1">Tổ 1</option>
            <option value="2">Tổ 2</option>
            <option value="3">Tổ 3</option>
            <option value="4">Tổ 4</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btn-goi-ten" data-i18n="seGoiTenBtn">🎲 Gọi tên!</button>
      </div>
      <div id="goi-ten-result" class="goi-ten-result hidden"></div>
    </div>

  </main>

  <div id="toast-container" aria-live="polite"></div>

  <script src="../js/i18n.js"></script>
  <script src="../js/local-db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/student-picker.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/seating.js"></script>
</body>
</html>
